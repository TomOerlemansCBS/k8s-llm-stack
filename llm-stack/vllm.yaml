apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai-cpu:latest-arm64
        env:
        - name: VLLM_USE_V1
          value: "0"
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args: ["--model", "TinyLlama/TinyLlama-1.1B-Chat-v1.0", "--host", "0.0.0.0", "--port", "8000", "--max-model-len", "1024", "--enforce-eager"]
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: llm-stack
spec:
  selector:
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
