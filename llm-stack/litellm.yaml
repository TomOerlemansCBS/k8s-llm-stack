apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm-stack
data:
  config.yaml: |
    model_list:
      - model_name: tinyllama
        litellm_params:
          model: openai/TinyLlama/TinyLlama-1.1B-Chat-v1.0
          api_base: http://vllm-service.llm-stack.svc.cluster.local:8000/v1
          api_key: "sk-dummy-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        args: ["--config", "/app/config.yaml", "--port", "4000"]
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config-volume
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-service
  namespace: llm-stack
spec:
  selector:
    app: litellm
  ports:
  - port: 4000
    targetPort: 4000
