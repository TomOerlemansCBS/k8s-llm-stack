apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/TomOerlemansCBS/k8s-llm-stack.git'
    targetRevision: HEAD
    path: llm-stack
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: llm-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
